<div class="card mb-4" *ngFor="let post of postsList$ | async as posts">
  <div class="card-header"><h5 class="card-title">{{post.submittedBy}}</h5></div>
  <div class="card-body">
    <p class="card-text">{{post.comments}}</p>
  </div>
  <div class="card-footer"><small class="text-muted ms-auto">Posted on {{post.submittedOn | date:'full'}}</small></div>
</div>

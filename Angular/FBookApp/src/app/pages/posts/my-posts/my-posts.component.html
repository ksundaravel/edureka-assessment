<div class="card mt-4">
  <img class="card-img-top" src="images/profile.jpeg" alt="Card image cap">
  <div class="card-body text-center">
    <h5 class="card-title">{{loggedUser.fullname}}</h5>
    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
  </div>
  <ul class="list-group list-group-flush text-center my-counts">
    <li class="list-group-item"><span class="count">20</span> Connections</li>
    <li class="list-group-item"><span class="count">{{myPostCount}}</span> Posts</li>
  </ul>
  <div class="card-body text-center">
    <a routerLink="../network" class="card-link">Network</a>
    <a routerLink="../friends" class="card-link">Friends List</a>
  </div>
</div>

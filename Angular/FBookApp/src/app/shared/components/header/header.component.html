<header class="p-1 bg-primary text-white">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <nav class="navbar navbar-expand-lg navbar-light bg-primary me-4">
        <a class="navbar-brand" href="#">FBook</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="app-navbar collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="home">Home</a>
            </li>
            @if(role === roles.ADMIN) {
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="users">Users</a>
            </li>
            }
            @if(role === roles.USER) {
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="network">Network</a>
            </li>
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="friends">Friends</a>
            </li>
            }
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="contacts">Contacts</a>
            </li>
          </ul>
        </div>
      </nav>

      <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3 ms-auto">
        <input type="search" class="form-control form-control-dark" placeholder="Search..." aria-label="Search">
      </form>
      @if(!authService.isUserLoggedIn()){
      <div class="text-end">
        <a class="btn btn-outline-light me-2" routerLink="login">Login</a>
        <a class="btn btn-warning text-white" routerLink="registration">Sign-up</a>
      </div>
      }@else {
      <nav class="navbar navbar-expand-lg bg-transparent">
        <div class="container-fluid">
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link text-white" href="#"><i class="bi bi-bell-fill"></i></a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  Sundar <i class="bi bi-person-circle"></i>
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" routerLink="my-profile">My Profile</a></li>
                  <li><a class="dropdown-item" (click)="authService.logout()">Logout</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      }
    </div>
  </div>
</header>

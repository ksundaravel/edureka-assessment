<header class="p-3 bg-primary text-white">
  <div class="container">
    <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
      <nav class="navbar navbar-expand-lg navbar-light bg-primary me-4">
        <a class="navbar-brand" href="#">Website</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="app-navbar collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="home">Home</a>
            </li>
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="employees">Employees</a>
            </li>
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="products">Products</a>
            </li>
            <li class="nav-item" routerLinkActive="active">
              <a class="nav-link" routerLink="contacts">Contacts</a>
            </li>
          </ul>
        </div>
      </nav>

      <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3 ms-auto">
        <input type="search" class="form-control form-control-dark" placeholder="Search..." aria-label="Search">
      </form>

      <div class="text-end" *ngIf="!authService.isUserLoggedIn();else logoutRef">
        <a class="btn btn-outline-light me-2" routerLink="login">Login</a>
        <a class="btn btn-warning text-white" routerLink="registration">Sign-up</a>
      </div>
      <ng-template #logoutRef>
        <div class="text-end">
          <a class="btn btn-warning text-white" (click)="authService.logout()">Logout</a>
        </div>
      </ng-template>
    </div>
  </div>
</header>
